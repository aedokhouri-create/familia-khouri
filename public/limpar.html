<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Limpando cache…</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,sans-serif;background:#f5f5f7;display:flex;align-items:center;justify-content:center;height:100vh;padding:32px;text-align:center}
    .wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
    h1{font-size:22px;font-weight:700;color:#1c1c1e}
    p{font-size:15px;color:#8e8e93;line-height:1.5}
    .spinner{width:40px;height:40px;border:3px solid #e5e5ea;border-top-color:#007aff;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .btn{padding:14px 32px;border:none;border-radius:14px;background:#007aff;color:#fff;font-size:16px;font-weight:600;cursor:pointer;width:100%;display:none}
  </style>
</head>
<body>
<div class="wrap">
  <div style="font-size:48px">🏡</div>
  <h1 id="title">Atualizando app…</h1>
  <div class="spinner" id="spin"></div>
  <p id="msg">Limpando cache antigo, aguarde…</p>
  <button class="btn" id="btn" onclick="window.location.href='/'">Abrir Família Khouri →</button>
</div>
<script>
async function clean() {
  try {
    // Unregister all service workers
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    // Clear all caches
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    document.getElementById('spin').style.display = 'none';
    document.getElementById('title').textContent = '✅ Pronto!';
    document.getElementById('msg').textContent = 'Cache limpo! Toque no botão para abrir o app.';
    document.getElementById('btn').style.display = 'block';
  } catch(e) {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('title').textContent = 'Tudo certo!';
    document.getElementById('msg').textContent = 'Toque para abrir o app.';
    document.getElementById('btn').style.display = 'block';
  }
}
clean();
</script>
</body>
</html>
