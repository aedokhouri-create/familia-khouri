<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Família Khouri"/>
  <meta name="theme-color" content="#ffffff"/>
  <title>Família Khouri</title>
  <link rel="manifest" href="manifest.json"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;color:#1c1c1e}
    #app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:#fff}
    #hdr{padding:50px 16px 10px;background:#fff;border-bottom:1px solid #e5e5ea;flex-shrink:0}
    .hdr-row{display:flex;align-items:center;gap:10px}
    #hdrAv{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid #e5e5ea;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;cursor:pointer;background:#f2f2f7}
    #hdrAv img{width:100%;height:100%;object-fit:cover}
    #hdrTitle{font-size:18px;font-weight:700;flex:1}
    #hdrSub{font-size:11px;color:#8e8e93;margin-top:2px}
    .mnav{display:flex;align-items:center;gap:8px;margin-top:8px}
    .mnav button{background:#f2f2f7;border:none;border-radius:8px;padding:4px 14px;font-size:16px;cursor:pointer}
    .mnav span{flex:1;text-align:center;font-size:14px;font-weight:600}
    #content{flex:1;overflow-y:auto;padding-bottom:80px;-webkit-overflow-scrolling:touch}
    #tabbar{display:flex;background:#fff;border-top:1px solid #e5e5ea;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
    .tb{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 2px 5px;border:none;background:none;cursor:pointer;color:#8e8e93;font-size:9px;gap:2px}
    .tb span:first-child{font-size:20px}
    .tb.on{color:#007aff}
    .sec{margin:14px 14px 0}
    .card{background:#fff;border-radius:16px;border:1px solid #e5e5ea;overflow:hidden;margin-bottom:12px}
    .chd{padding:12px 16px 0;font-size:11px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:.4px}
    .cbd{padding:10px 16px 14px}
    .mcs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 14px 0}
    .mc{background:#f2f2f7;border-radius:14px;padding:12px 14px}
    .mc .lb{font-size:11px;color:#8e8e93;margin-bottom:3px}
    .mc .vl{font-size:18px;font-weight:700}
    .mc.full{grid-column:1/-1}
    .red{color:#ff3b30}.amber{color:#ff9500}.green{color:#34c759}
    .fg{margin-bottom:10px}
    .fg label{display:block;font-size:12px;color:#8e8e93;margin-bottom:4px;font-weight:500}
    .fg input,.fg select{width:100%;padding:11px 13px;border:1px solid #e5e5ea;border-radius:12px;font-size:15px;background:#f9f9f9;color:#1c1c1e;-webkit-appearance:none;font-family:inherit}
    .fg input:focus,.fg select:focus{outline:none;border-color:#007aff;background:#fff}
    .fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{width:100%;padding:13px;border:none;border-radius:12px;background:#007aff;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
    .btn.teal{background:#00c7be}
    .btn.green-btn{background:#34c759}
    .ws{display:flex;gap:8px}
    .wb{flex:1;padding:9px 4px;border:1.5px solid #e5e5ea;border-radius:11px;background:none;font-size:12px;cursor:pointer;color:#8e8e93;font-weight:500;text-align:center}
    .wb.on{border-color:#007aff;color:#007aff;background:#f0f7ff}
    .il{display:flex;flex-direction:column}
    .li{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #f2f2f7}
    .li:last-child{border-bottom:none}
    .li-ico{font-size:20px;flex-shrink:0}
    .li-info{flex:1;min-width:0}
    .li-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .li-sub{font-size:11px;color:#8e8e93;margin-top:1px}
    .li-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
    .li-amt{font-size:14px;font-weight:600}
    .dbtn{background:none;border:none;font-size:14px;color:#c7c7cc;cursor:pointer}
    .pbtn{padding:5px 10px;border:1.5px solid #34c759;border-radius:8px;background:none;font-size:11px;font-weight:600;color:#34c759;cursor:pointer;white-space:nowrap}
    .pbtn.off{border-color:#c7c7cc;color:#8e8e93}
    .badge{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
    .br{background:#fff2f1;color:#ff3b30}
    .ba{background:#fff8ee;color:#ff9500}
    .bg{background:#f0fff4;color:#34c759}
    .alrt{margin:12px 14px 0;background:#fff2f1;border-radius:14px;padding:11px 14px;border:1px solid #ffccc9}
    .alrt-t{font-size:12px;font-weight:600;color:#ff3b30;margin-bottom:7px}
    .pw{height:8px;background:#f2f2f7;border-radius:4px;overflow:hidden;margin:7px 0 3px}
    .pf{height:100%;border-radius:4px;transition:width .4s}
    .cr{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
    .cbw{flex:1;height:6px;background:#f2f2f7;border-radius:3px;overflow:hidden}
    .cb{height:100%;border-radius:3px}
    .brow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .bi{width:100px;padding:5px 9px;border:1px solid #e5e5ea;border-radius:9px;font-size:14px;text-align:right;background:#f9f9f9;color:#1c1c1e}
    .slbl{font-size:11px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:.4px;padding:8px 14px 4px}
    .empty{text-align:center;padding:24px 16px;font-size:13px;color:#c7c7cc}
    .cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
    .cal-dow{text-align:center;font-size:10px;color:#8e8e93;padding:4px 0;font-weight:600}
    .cal-d{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
    .cal-d.emp{cursor:default}
    .cal-d.tod{background:#007aff;color:#fff}
    .cal-d.hb::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#ff3b30}
    .cal-d.hp::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#34c759}
    .cal-d.tod::after{background:#fff!important}
    .cal-d.sel:not(.tod){background:#e8f0fe;color:#007aff}
    .dd{background:#f9f9f9;border-radius:12px;padding:10px 12px;margin-top:10px}
    .dd-t{font-size:13px;font-weight:600;margin-bottom:8px}
    .ai-btn{width:100%;padding:13px;border:1.5px dashed #007aff;border-radius:12px;background:#f0f7ff;color:#007aff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}
    .cfg-av{width:64px;height:64px;border-radius:16px;background:#f2f2f7;border:2px dashed #007aff;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
    .cfg-av img{width:100%;height:100%;object-fit:cover}

    /* User screen */
    #uscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:14px;padding:32px;text-align:center;background:#fff}
    .u-ico{width:90px;height:90px;border-radius:22px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden;margin-bottom:4px}
    .u-ico img{width:100%;height:100%;object-fit:cover}
    #uscreen h2{font-size:22px;font-weight:700}
    #uscreen p{font-size:14px;color:#8e8e93}
    .ubtns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:4px}
    .ubtn{padding:14px 16px;border:1.5px solid #e5e5ea;border-radius:16px;background:#f9f9f9;font-size:16px;font-weight:600;cursor:pointer;color:#1c1c1e;display:flex;align-items:center;gap:10px}
    .uav{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#e5e5ea;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .uav img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .orl{font-size:12px;color:#c7c7cc}
    .cnw{display:flex;gap:8px;width:100%}
    .cnw input{flex:1;padding:13px;border:1.5px solid #e5e5ea;border-radius:12px;font-size:15px;background:#f9f9f9;color:#1c1c1e}
    .cnw button{padding:13px 16px;border:none;border-radius:12px;background:#007aff;color:#fff;font-size:16px;font-weight:700;cursor:pointer}

    /* Modal */
    .mo{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200}
    .mb{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px 40px;width:100%;max-width:480px}
    .mt{font-size:17px;font-weight:700;margin-bottom:4px}
    .ms{font-size:13px;color:#8e8e93;margin-bottom:16px}
    .mcl{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:#8e8e93;margin-top:-4px}
    .po{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .popt{padding:16px;border:1.5px solid #e5e5ea;border-radius:16px;background:#f9f9f9;font-size:14px;font-weight:600;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
    .popt span{font-size:26px}

    @media(prefers-color-scheme:dark){
      html,body,#uscreen{background:#000;color:#f2f2f7}
      #app,#uscreen{background:#1c1c1e}
      #hdr{background:#1c1c1e;border-color:#38383a}
      #hdrTitle{color:#f2f2f7}
      #tabbar{background:#1c1c1e;border-color:#38383a}
      .card{background:#2c2c2e;border-color:#38383a}
      .mc{background:#2c2c2e}
      .fg input,.fg select{background:#2c2c2e;border-color:#38383a;color:#f2f2f7}
      .fg input:focus,.fg select:focus{border-color:#0a84ff;background:#3a3a3c}
      .li{border-color:#3a3a3c}
      .pw,.cbw{background:#3a3a3c}
      .alrt{background:#2d1210;border-color:#6d2320}
      .mnav button{background:#2c2c2e;color:#f2f2f7}
      .bi{background:#2c2c2e;border-color:#38383a;color:#f2f2f7}
      .dd{background:#2c2c2e}
      .dd-t{color:#f2f2f7}
      .cal-d.sel:not(.tod){background:#1a2a3a;color:#4da3ff}
      .ai-btn{background:#0a1929;border-color:#0a84ff;color:#4da3ff}
      .mb{background:#2c2c2e}
      .mt{color:#f2f2f7}
      .wb{border-color:#38383a;color:#8e8e93}
      .wb.on{border-color:#0a84ff;color:#4da3ff;background:#0a1929}
      .ubtn{background:#2c2c2e;border-color:#38383a;color:#f2f2f7}
      .popt{background:#2c2c2e;border-color:#38383a;color:#f2f2f7}
      .cnw input{background:#2c2c2e;border-color:#38383a;color:#f2f2f7}
    }

    @media(min-width:700px){
      body{background:#e8eaf0}
      #app{max-width:680px;border-radius:16px;margin:20px auto;height:calc(100dvh - 40px);box-shadow:0 4px 32px rgba(0,0,0,.15)}
    }
    @media(min-width:700px) and (prefers-color-scheme:dark){
      body{background:#000}
      #app{box-shadow:0 4px 32px rgba(0,0,0,.5)}
    }
  </style>
</head>
<body>

<div id="uscreen">
  <div class="u-ico" id="uIco">🏡</div>
  <h2 id="uTitle">Família Khouri</h2>
  <p>Quem está acessando?</p>
  <div class="ubtns">
    <button class="ubtn" onclick="setUser('Aedão')">
      <div class="uav" id="uav-Aedão">👨</div><span>Aedão</span>
    </button>
    <button class="ubtn" onclick="setUser('Leti')">
      <div class="uav" id="uav-Leti">👩</div><span>Leti</span>
    </button>
  </div>
  <span class="orl">ou digite seu nome</span>
  <div class="cnw">
    <input id="cname" placeholder="Outro nome…"/>
    <button onclick="setCustom()">→</button>
  </div>
</div>

<div id="app" style="display:none;position:relative">
  <div id="hdr">
    <div class="hdr-row">
      <div id="hdrAv" onclick="openModal('avatar')">🏡</div>
      <div style="flex:1;min-width:0">
        <div id="hdrTitle">Família Khouri</div>
        <div id="hdrSub">
          <span id="hdrSubTxt">Olá!</span>
          <button onclick="openModal('name')" style="background:none;border:none;font-size:11px;color:#007aff;cursor:pointer;margin-left:6px">✏️ editar</button>
        </div>
      </div>
    </div>
    <div class="mnav">
      <button onclick="chM(-1)">‹</button>
      <span id="mLbl"></span>
      <button onclick="chM(1)">›</button>
    </div>
  </div>

  <div id="content"></div>

  <div id="tabbar">
    <button class="tb on" onclick="goTab('dash',this)" id="tb-dash"><span>📊</span><span>Resumo</span></button>
    <button class="tb" onclick="goTab('cal',this)" id="tb-cal"><span>📅</span><span>Calendário</span></button>
    <button class="tb" onclick="goTab('gastos',this)" id="tb-gastos"><span>💸</span><span>Gastos</span></button>
    <button class="tb" onclick="goTab('contas',this)" id="tb-contas"><span>📋</span><span>Contas</span></button>
    <button class="tb" onclick="goTab('cfg',this)" id="tb-cfg"><span>⚙️</span><span>Config</span></button>
  </div>

  <div id="modal" style="display:none" class="mo" onclick="closeModal(event)">
    <div class="mb"><button class="mcl" onclick="closeModal()">✕</button><div id="mcon"></div></div>
  </div>
</div>

<input type="file" id="pFam" accept="image/*" style="display:none" onchange="onPhoto(this,'family')"/>
<input type="file" id="pFamCam" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this,'family')"/>
<input type="file" id="pUsr" accept="image/*" style="display:none" onchange="onPhoto(this,'user')"/>
<input type="file" id="pUsrCam" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this,'user')"/>
<input type="file" id="pBill" accept="image/*" capture="environment" style="display:none" onchange="onBillPhoto(this)"/>
<input type="file" id="pBillG" accept="image/*" style="display:none" onchange="onBillPhoto(this)"/>

<script>
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const CATS={
  '🏠 Prestação':'#378ADD','💡 Consumo (luz/água/net)':'#EF9F27',
  '🏥 Seguro saúde':'#1D9E75','🛡️ Seguro de vida':'#7F77DD',
  '📈 Previdência':'#185FA5','🧒 Elisa':'#D4537E','👦 Gabi':'#00c7be',
  '🛒 Alimentação':'#34c759','🚗 Transporte':'#ff9500',
  '💊 Saúde/Farmácia':'#E24B4A','🎭 Lazer':'#a259f7',
  '👗 Vestuário':'#D85A30','📦 Outros':'#888780'
};
const BILL_CATS=['🏠 Prestação','💡 Consumo (luz/água/net)','🏥 Seguro saúde','🛡️ Seguro de vida','📈 Previdência'];

let cu='',curM=new Date().getMonth(),curY=new Date().getFullYear(),tab='dash',selDay=null,prefDate='',whoSel='';

function gp(){try{return JSON.parse(localStorage.getItem('fk-p')||'{}')}catch{return{}}}
function sp(p){localStorage.setItem('fk-p',JSON.stringify(p))}
function getPref(k){return gp()[k]||null}
function setPref(k,v){const p=gp();p[k]=v;sp(p)}
function gd(){try{return JSON.parse(localStorage.getItem('fk-d')||'{}')}catch{return{}}}
function getData(){const d=gd();return{gastos:d.gastos||[],contas:d.contas||[],budget:d.budget||3000,lastBy:d.lastBy||'',lastAt:d.lastAt||''}}
function mutate(fn){const d=getData();fn(d);d.lastBy=cu;d.lastAt=new Date().toISOString();localStorage.setItem('fk-d',JSON.stringify(d));render()}
function fmt(n){return'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){return new Date().toISOString().split('T')[0]}
function ddiff(ds){if(!ds)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(ds+'T00:00:00')-t)/86400000)}
function dbadge(ds){const d=ddiff(ds);if(d===null)return'';if(d<0)return`<span class="badge br">Vencida ${Math.abs(d)}d</span>`;if(d===0)return`<span class="badge ba">Hoje!</span>`;if(d<=5)return`<span class="badge ba">Em ${d}d</span>`;return`<span class="badge bg">Em ${d}d</span>`}
function ico(c){return(c||'📦').split(' ')[0]}
function nm(c){return(c||'Outros').replace(/^\S+\s/,'')}
function f2b(f){return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}

function applyUI(){
  const ph=getPref('famPhoto'),ttl=getPref('appTitle')||'Família Khouri';
  const el=e=>document.getElementById(e);
  if(el('uIco'))el('uIco').innerHTML=ph?`<img src="${ph}"/>`:'🏡';
  if(el('uTitle'))el('uTitle').textContent=ttl;
  if(el('hdrAv'))el('hdrAv').innerHTML=ph?`<img src="${ph}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>`:'🏡';
  if(el('hdrTitle'))el('hdrTitle').textContent=ttl;
  ['Aedão','Leti'].forEach(n=>{const a=el('uav-'+n);if(!a)return;const p=getPref('photo-'+n);a.innerHTML=p?`<img src="${p}"/>`:(n==='Aedão'?'👨':'👩')});
}

window.setUser=function(n){cu=n;localStorage.setItem('fk-u',n);whoSel=n;showApp()}
window.setCustom=function(){const v=document.getElementById('cname').value.trim();if(v)setUser(v)}
document.getElementById('cname').addEventListener('keydown',e=>{if(e.key==='Enter')setCustom()})

function showApp(){
  document.getElementById('uscreen').style.display='none';
  document.getElementById('app').style.display='flex';
  goTab('dash',document.getElementById('tb-dash'));
}

const su=localStorage.getItem('fk-u');
if(su){cu=su;whoSel=su;showApp()}
applyUI();

window.goTab=function(t,btn){tab=t;selDay=null;document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render()}
window.chM=function(d){curM+=d;if(curM>11){curM=0;curY++}if(curM<0){curM=11;curY--}selDay=null;render()}
window.selDay2=function(d){selDay=selDay===d?null:d;render()}

function render(){
  document.getElementById('mLbl').textContent=MONTHS[curM]+' '+curY;
  const d=getData();
  const la=d.lastAt?new Date(d.lastAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
  document.getElementById('hdrSubTxt').textContent=d.lastBy&&la?`${cu} · ${d.lastBy} às ${la}`:`Olá, ${cu}!`;
  const c=document.getElementById('content');
  if(tab==='dash')  c.innerHTML=rDash(d);
  if(tab==='cal')   c.innerHTML=rCal(d);
  if(tab==='gastos')c.innerHTML=rGastos(d);
  if(tab==='contas')c.innerHTML=rContas(d);
  if(tab==='cfg')   c.innerHTML=rCfg();
}

function rDash(d){
  const mg=d.gastos.filter(g=>{const dt=new Date(g.date+'T00:00:00');return dt.getMonth()===curM&&dt.getFullYear()===curY});
  const tot=mg.reduce((s,g)=>s+g.amt,0);
  const pend=d.contas.filter(c=>!c.paid),ptot=pend.reduce((s,c)=>s+c.amt,0);
  const pct=d.budget>0?Math.min(100,tot/d.budget*100):0;
  const pc=pct>90?'#ff3b30':pct>70?'#ff9500':'#34c759';
  const urg=pend.filter(c=>{const df=ddiff(c.due);return df!==null&&df<=5}).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  const cm={};mg.forEach(g=>{cm[g.cat]=(cm[g.cat]||0)+g.amt});
  const cats=Object.entries(cm).sort((a,b)=>b[1]-a[1]),mx=cats[0]?.[1]||1;
  return`
  <div class="mcs">
    <div class="mc"><div class="lb">Gasto no mês</div><div class="vl red">${fmt(tot)}</div></div>
    <div class="mc"><div class="lb">Contas pendentes</div><div class="vl amber">${fmt(ptot)}</div></div>
    <div class="mc full">
      <div class="brow"><span class="lb" style="margin:0">Orçamento mensal</span><input class="bi" type="number" value="${d.budget}" onchange="updBudget(this.value)"/></div>
      <div class="pw"><div class="pf" style="width:${pct.toFixed(1)}%;background:${pc}"></div></div>
      <div style="font-size:11px;color:#8e8e93;text-align:right">${fmt(tot)} de ${fmt(d.budget)} · ${pct.toFixed(0)}% usado</div>
    </div>
  </div>
  ${urg.length?`<div class="alrt"><div class="alrt-t">⚠️ Contas vencendo em breve</div>${urg.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:13px"><span>${c.name}</span><div style="display:flex;align-items:center;gap:7px">${dbadge(c.due)}<strong class="red">${fmt(c.amt)}</strong></div></div>`).join('')}</div>`:''}
  <div class="sec">
    <div class="card"><div class="chd">Por categoria</div><div class="cbd">
      ${cats.length?cats.map(([cat,val])=>`<div class="cr"><span style="font-size:16px">${ico(cat)}</span><span style="flex:1;font-size:12px">${nm(cat)}</span><div class="cbw"><div class="cb" style="width:${(val/mx*100).toFixed(1)}%;background:${CATS[cat]||'#888'}"></div></div><span style="font-size:11px;color:#8e8e93;min-width:76px;text-align:right">${fmt(val)}</span></div>`).join(''):'<div class="empty">Nenhum gasto</div>'}
    </div></div>
    <div class="card"><div class="chd">Últimos lançamentos</div><div class="il">

    </div></div>
  </div>`;
}

function rCal(d){
  const tn=new Date(),isNow=tn.getMonth()===curM&&tn.getFullYear()===curY,tdD=isNow?tn.getDate():null;
  const fd=new Date(curY,curM,1).getDay(),dim=new Date(curY,curM+1,0).getDate();
  const bd={},gd2={};
  d.contas.forEach(c=>{if(!c.due)return;const dt=new Date(c.due+'T00:00:00');if(dt.getMonth()===curM&&dt.getFullYear()===curY){const day=dt.getDate();if(!bd[day])bd[day]=[];bd[day].push(c)}});
  d.gastos.forEach(g=>{const dt=new Date(g.date+'T00:00:00');if(dt.getMonth()===curM&&dt.getFullYear()===curY){const day=dt.getDate();if(!gd2[day])gd2[day]=[];gd2[day].push(g)}});
  let h=`<div class="sec"><div class="card"><div class="cbd" style="padding-top:14px"><div class="cal-g">`;
  h+=DS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<fd;i++)h+=`<div class="cal-d emp"></div>`;
  for(let day=1;day<=dim;day++){
    const hb=bd[day]?.length>0,hg=gd2[day]?.length>0,ap=hb&&bd[day].every(b=>b.paid);
    let cls='cal-d';
    if(day===tdD)cls+=' tod';
    if(day===selDay)cls+=' sel';
    if(hb&&ap)cls+=' hp';else if(hb||hg)cls+=' hb';
    h+=`<div class="${cls}" onclick="selDay2(${day})">${day}</div>`;
  }
  h+=`</div><div style="display:flex;gap:14px;margin-top:6px;font-size:11px;color:#8e8e93">
    <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff3b30;margin-right:3px;vertical-align:middle"></span>Pendente</span>
    <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#34c759;margin-right:3px;vertical-align:middle"></span>Paga</span>
  </div>`;
  if(selDay){
    const db=bd[selDay]||[],dg=gd2[selDay]||[];
    const ds=`${curY}-${String(curM+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`;
    h+=`<div class="dd"><div class="dd-t">📆 Dia ${selDay} de ${MONTHS[curM]}</div>`;
    if(db.length){h+=`<div style="font-size:11px;font-weight:600;color:#8e8e93;margin-bottom:6px">CONTAS</div>`;db.forEach(c=>{h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f2f2f7"><span style="font-size:17px">${ico(c.cat)}</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500${c.paid?';text-decoration:line-through;color:#8e8e93':''}">${c.name}</div><div style="font-size:11px;color:#8e8e93">${c.rec==='monthly'?'Mensal':c.rec==='yearly'?'Anual':'Única'}</div></div><span style="font-size:13px;font-weight:600;color:${c.paid?'#8e8e93':'#ff3b30'}">${fmt(c.amt)}</span><button class="pbtn ${c.paid?'off':''}" onclick="pagConta(${c.id})">${c.paid?'↩':'✓'}</button></div>`})}
    if(dg.length){h+=`<div style="font-size:11px;font-weight:600;color:#8e8e93;margin:10px 0 6px">GASTOS</div>`;dg.forEach(g=>{h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f2f2f7"><span style="font-size:17px">${ico(g.cat)}</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500">${g.name}</div><div style="font-size:11px;color:#8e8e93">${nm(g.cat)} · ${g.who}</div></div><span style="font-size:13px;font-weight:600;color:#ff3b30">${fmt(g.amt)}</span><button class="dbtn" onclick="delGasto(${g.id})">✕</button></div>`})}
    if(!db.length&&!dg.length)h+=`<div style="text-align:center;padding:12px 0;font-size:13px;color:#8e8e93">Nenhum lançamento</div>`;
    h+=`<div style="display:flex;gap:8px;margin-top:10px"><button onclick="qa('gastos','${ds}')" style="flex:1;padding:9px;border:none;border-radius:10px;background:#007aff;color:#fff;font-size:13px;font-weight:600;cursor:pointer">+ Gasto</button><button onclick="qa('contas','${ds}')" style="flex:1;padding:9px;border:none;border-radius:10px;background:#00c7be;color:#fff;font-size:13px;font-weight:600;cursor:pointer">+ Conta</button></div></div>`;
  }
  h+=`</div></div></div>`;return h;
}

function rGastos(d){
  const mg=d.gastos.filter(g=>{const dt=new Date(g.date+'T00:00:00');return dt.getMonth()===curM&&dt.getFullYear()===curY}).sort((a,b)=>b.date.localeCompare(a.date));
  const id=prefDate||today();prefDate='';
  const ec=Object.keys(CATS).filter(k=>!BILL_CATS.includes(k));
  const wl=['Aedão','Leti','Conjunto'];
  return`<div class="sec">
    <div class="card"><div class="chd">Novo gasto</div><div class="cbd">
      <div class="fg"><label>Descrição</label><input id="gN" placeholder="Ex: Mercado, Escola Elisa, Farmácia…"/></div>
      <div class="fr"><div class="fg"><label>Valor (R$)</label><input type="number" id="gA" placeholder="0,00" min="0" step="0.01" inputmode="decimal"/></div>
      <div class="fg"><label>Data</label><input type="date" id="gD" value="${id}"/></div></div>
      <div class="fg"><label>Categoria</label><select id="gC">${ec.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
      <div class="fg"><label>Pago por</label><div class="ws">${wl.map(w=>`<button class="wb${w===whoSel?' on':''}" id="wb-${w}" onclick="selW('${w}')">${w==='Aedão'?'👨':w==='Leti'?'👩':'👫'} ${w}</button>`).join('')}</div></div>
      <button class="btn" onclick="addGasto()">+ Adicionar gasto</button>
    </div></div>
    <div class="card"><div class="chd">Lançamentos — ${MONTHS[curM]}</div><div class="il">
      ${mg.length?mg.map(g=>`<div class="li"><span class="li-ico">${ico(g.cat)}</span><div class="li-info"><div class="li-name">${g.name}</div><div class="li-sub">${nm(g.cat)} · ${g.date} · ${g.who}</div></div><div class="li-r"><span class="li-amt red">${fmt(g.amt)}</span><button class="dbtn" onclick="delGasto(${g.id})">✕</button></div></div>`).join(''):'<div class="empty">Nenhum gasto neste mês</div>'}
    </div></div>
  </div>`;
}

function rContas(d){
  const pend=d.contas.filter(c=>!c.paid).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  const paid=d.contas.filter(c=>c.paid);
  const id=prefDate||'';prefDate='';
  return`<div class="sec">
    <button class="ai-btn" onclick="document.getElementById('pBill').click()">📷 Fotografar conta <span style="font-size:11px;background:#007aff;color:#fff;padding:2px 8px;border-radius:20px;font-weight:700">IA</span></button>
    <button class="ai-btn" style="background:#f0fff4;border-color:#34c759;color:#1a7a3a;margin-top:-4px" onclick="document.getElementById('pBillG').click()">🖼️ Da galeria <span style="font-size:11px;background:#34c759;color:#fff;padding:2px 8px;border-radius:20px;font-weight:700">IA</span></button>
    <div id="aiR"></div>
    <div class="card"><div class="chd">Adicionar conta</div><div class="cbd">
      <div class="fg"><label>Nome</label><input id="cN" placeholder="Ex: Prestação, Seguro, Luz…"/></div>
      <div class="fr"><div class="fg"><label>Valor (R$)</label><input type="number" id="cA" placeholder="0,00" min="0" step="0.01" inputmode="decimal"/></div>
      <div class="fg"><label>Vencimento</label><input type="date" id="cD" value="${id}"/></div></div>
      <div class="fg"><label>Categoria</label><select id="cC">${Object.keys(CATS).map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
      <div class="fg"><label>Recorrência</label><select id="cR"><option value="monthly">Todo mês</option><option value="once">Única vez</option><option value="yearly">Todo ano</option></select></div>
      <button class="btn teal" onclick="addConta()">+ Adicionar conta</button>
    </div></div>
    ${pend.length?`<div class="slbl">Pendentes (${pend.length})</div><div class="card"><div class="il">
      ${pend.map(c=>`<div class="li" style="${ddiff(c.due)!==null&&ddiff(c.due)<0?'background:#fff8f7':''}"><span class="li-ico">${ico(c.cat)}</span><div class="li-info"><div class="li-name">${c.name}</div><div class="li-sub">${c.due?'Vence: '+c.due:'Sem data'} · ${c.rec==='monthly'?'Mensal':c.rec==='yearly'?'Anual':'Única'}</div><div style="margin-top:3px">${dbadge(c.due)}</div></div><div class="li-r"><span class="li-amt red">${fmt(c.amt)}</span><button class="pbtn" onclick="pagConta(${c.id})">✓ Pagar</button><button class="dbtn" onclick="delConta(${c.id})">✕</button></div></div>`).join('')}
    </div></div>`:'<div class="empty" style="padding:14px 0 4px">Sem contas pendentes 🎉</div>'}
    ${paid.length?`<div class="slbl">Pagas (${paid.length})</div><div class="card"><div class="il">
      ${paid.map(c=>`<div class="li" style="opacity:.6"><span class="li-ico">${ico(c.cat)}</span><div class="li-info"><div class="li-name" style="text-decoration:line-through">${c.name}</div><div class="li-sub">${c.rec==='monthly'?'Mensal':c.rec==='yearly'?'Anual':'Única'} · ${c.paidBy||''}</div></div><div class="li-r"><span class="li-amt" style="color:#8e8e93">${fmt(c.amt)}</span><button class="pbtn off" onclick="pagConta(${c.id})">↩</button><button class="dbtn" onclick="delConta(${c.id})">✕</button></div></div>`).join('')}
    </div></div>`:''}
  </div>`;
}

  const fp=getPref('famPhoto'),mp=getPref('photo-'+cu);
  return`<div class="sec">
    <div class="card"><div class="chd">Foto e ícone do app</div><div class="cbd">

      </div>
      ${fp?`<div style="background:#f0f7ff;border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px;color:#007aff;font-weight:500">✅ Foto salva! Para aparecer no ícone, reinstale o app:</div>
      <div style="background:#f9f9f9;border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px;line-height:1.7">

    <div class="card"><div class="chd">Meu perfil</div><div class="cbd">

        <div><div style="font-size:14px;font-weight:600">${cu}</div>
        <div style="font-size:12px;color:#007aff;cursor:pointer;margin-top:3px" onclick="openModal('user')">Trocar foto →</div></div>
      </div>
      <div class="fg"><label>Meu nome</label><input id="cfgN" value="${cu}"/></div>
      <button class="btn teal" onclick="saveCfgName()">Salvar nome</button>
    </div></div>
    <div class="card"><div class="chd">Orçamento</div><div class="cbd">

}

// Modal
window.openModal=function(type){
  const mc=document.getElementById('mcon');
  if(type==='avatar'){
    mc.innerHTML=`<div class="mt">Foto do app</div><div class="ms">Aparece no ícone e no topo</div>
    <div class="po">
      <div class="popt" onclick="document.getElementById('pFamCam').click()"><span>📷</span>Tirar foto</div>
      <div class="popt" onclick="document.getElementById('pFam').click()"><span>🖼️</span>Da galeria</div>
    </div>
    ${getPref('famPhoto')?`<img src="${getPref('famPhoto')}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #007aff;display:block;margin:0 auto 12px"/>
    <button class="btn" style="background:none;border:1.5px solid #ff3b30;color:#ff3b30" onclick="setPref('famPhoto',null);closeModal();applyUI();render()">Remover foto</button>`:''}`
  } else if(type==='name'){
    mc.innerHTML=`<div class="mt">Editar nome</div><div class="ms">Como quer ser chamado(a)?</div>
    <div class="fg"><label>Seu nome</label><input id="enInput" value="${cu}"/></div>
    <button class="btn" onclick="saveEditName()">Salvar</button>`
  } else if(type==='user'){
    mc.innerHTML=`<div class="mt">Sua foto de perfil</div><div class="ms">Aparece na tela de entrada</div>
    <div class="po">
      <div class="popt" onclick="document.getElementById('pUsrCam').click()"><span>📷</span>Tirar foto</div>
      <div class="popt" onclick="document.getElementById('pUsr').click()"><span>🖼️</span>Da galeria</div>
    </div>
    ${getPref('photo-'+cu)?`<img src="${getPref('photo-'+cu)}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;display:block;margin:0 auto"/>`:''}`
  }
  document.getElementById('modal').style.display='flex';
}
window.closeModal=function(e){if(!e||e.target===document.getElementById('modal'))document.getElementById('modal').style.display='none'}
window.saveEditName=function(){const v=document.getElementById('enInput').value.trim();if(v){cu=v;localStorage.setItem('fk-u',v);}closeModal();render()}
window.saveCfgTitle=function(){const v=document.getElementById('cfgT').value.trim();if(v){setPref('appTitle',v);applyUI();render()}}
window.saveCfgName=function(){const v=document.getElementById('cfgN').value.trim();if(v){cu=v;localStorage.setItem('fk-u',v);whoSel=v;render()}}
window.saveBudget=function(){const v=parseFloat(document.getElementById('cfgB').value);if(v>0)mutate(d=>{d.budget=v})}
window.logout=function(){localStorage.removeItem('fk-u');cu='';document.getElementById('app').style.display='none';document.getElementById('uscreen').style.display='flex';applyUI()}

// Photo handlers
window.onPhoto=async function(input,type){
  if(!input.files||!input.files[0])return;
  const b64=await f2b(input.files[0]);
  if(type==='family'){setPref('famPhoto',b64);}
  else{setPref('photo-'+cu,b64);}
  closeModal();applyUI();render();input.value='';
}

// Bill AI
window.onBillPhoto=async function(input){
  if(!input.files||!input.files[0])return;
  const file=input.files[0];
  const ar=document.getElementById('aiR');
  if(ar)ar.innerHTML=`<div style="text-align:center;padding:14px;font-size:13px;color:#8e8e93">🤖 Analisando com IA…</div>`;
  try{
    const b64=await f2b(file);
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type,data:b64.split(',')[1]}},{type:'text',text:'Analise esta conta/boleto. Responda APENAS em JSON: {"nome":"nome","valor":123.45,"vencimento":"YYYY-MM-DD"} - valor sem R$ ou pontos, null se não encontrar'}]}]})});
    const data=await res.json();
    let info;try{info=JSON.parse((data.content?.[0]?.text||'{}').replace(/```json|```/g,'').trim())}catch{info={}}
    if(info.nome||info.valor){
      if(ar)ar.innerHTML=`<div class="card" style="margin-bottom:10px;border-color:#34c759"><div class="chd" style="color:#34c759">✅ IA identificou</div><div class="cbd">
        <div class="fg"><label>Nome</label><input id="aiN" value="${info.nome||''}"/></div>
        <div class="fr"><div class="fg"><label>Valor</label><input type="number" id="aiA" value="${info.valor||''}" inputmode="decimal"/></div>
        <div class="fg"><label>Vencimento</label><input type="date" id="aiD" value="${info.vencimento||''}"/></div></div>
        <button class="btn teal" onclick="saveAI()">✓ Salvar</button>
        <button onclick="document.getElementById('aiR').innerHTML=''" style="width:100%;margin-top:8px;padding:10px;border:none;border-radius:12px;background:none;color:#8e8e93;font-size:14px;cursor:pointer">Cancelar</button>
      </div></div>`;
    } else {
      if(ar){ar.innerHTML=`<div style="text-align:center;padding:10px;font-size:13px;color:#ff9500;margin-bottom:8px">⚠️ Não consegui ler. Preencha manualmente.</div>`;setTimeout(()=>{if(ar)ar.innerHTML=''},3000)}
    }
  }catch(e){if(ar){ar.innerHTML=`<div style="text-align:center;padding:10px;font-size:13px;color:#ff3b30">❌ Erro. Tente novamente.</div>`;setTimeout(()=>{if(ar)ar.innerHTML=''},3000)}}
  input.value='';
}
window.saveAI=function(){
  const n=document.getElementById('aiN')?.value.trim(),a=parseFloat(document.getElementById('aiA')?.value),du=document.getElementById('aiD')?.value;
  if(!n||isNaN(a)||a<=0){alert('Confira nome e valor.');return}
  mutate(d=>{d.contas.unshift({id:Date.now(),name:n,amt:a,due:du,rec:'monthly',cat:'💡 Consumo (luz/água/net)',paid:false,paidBy:''})});
  const ar=document.getElementById('aiR');if(ar)ar.innerHTML='';
}

// CRUD
window.qa=function(t,date){prefDate=date;goTab(t,document.getElementById('tb-'+t))}
window.selW=function(w){whoSel=w;document.querySelectorAll('.wb').forEach(b=>b.classList.remove('on'));const b=document.getElementById('wb-'+w);if(b)b.classList.add('on')}
window.addGasto=function(){
  const n=document.getElementById('gN').value.trim(),a=parseFloat(document.getElementById('gA').value),dt=document.getElementById('gD').value||today(),cat=document.getElementById('gC').value;
  if(!n||isNaN(a)||a<=0){alert('Preencha descrição e valor.');return}
  mutate(d=>{d.gastos.unshift({id:Date.now(),name:n,amt:a,date:dt,cat,who:whoSel||cu})});
  document.getElementById('gN').value='';document.getElementById('gA').value='';
}
window.delGasto=function(id){if(!confirm('Remover?'))return;mutate(d=>{d.gastos=d.gastos.filter(g=>g.id!==id)})}
window.addConta=function(){
  const n=document.getElementById('cN').value.trim(),a=parseFloat(document.getElementById('cA').value),du=document.getElementById('cD').value,rec=document.getElementById('cR').value,cat=document.getElementById('cC').value;
  if(!n||isNaN(a)||a<=0){alert('Preencha nome e valor.');return}
  mutate(d=>{d.contas.unshift({id:Date.now(),name:n,amt:a,due:du,rec,cat,paid:false,paidBy:''})});
  document.getElementById('cN').value='';document.getElementById('cA').value='';document.getElementById('cD').value='';
}
window.pagConta=function(id){mutate(d=>{const c=d.contas.find(x=>x.id===id);if(c){c.paid=!c.paid;c.paidBy=cu}})}
window.delConta=function(id){if(!confirm('Remover?'))return;mutate(d=>{d.contas=d.contas.filter(c=>c.id!==id)})}
window.updBudget=function(v){mutate(d=>{d.budget=parseFloat(v)||0})}

render();
// Unregister old service workers
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(regs=>{regs.forEach(r=>r.unregister())})}
</script>
</body>
</html>
