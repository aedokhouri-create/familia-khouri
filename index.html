  <style>

    .fg input,.fg select{width:100%;padding:11px 13px;border:1px solid #e5e5ea;border-radius:12px;font-size:15px;background:#f9f9f9;color:#1c1c1e;-webkit-appearance:none;font-family:inherit}
    .fg input:focus,.fg select:focus{outline:none;border-color:#007aff;background:#fff}
    .fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{width:100%;padding:13px;border:none;border-radius:12px;background:#007aff;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
    .btn.teal{background:#00c7be}
    .btn.grn{background:#34c759}
    .ws{display:flex;gap:8px}
    .wb{flex:1;padding:9px 4px;border:1.5px solid #e5e5ea;border-radius:11px;background:none;font-size:12px;cursor:pointer;color:#8e8e93;font-weight:500;text-align:center}
    .wb.on{border-color:#007aff;color:#007aff;background:#f0f7ff}
    .il{display:flex;flex-direction:column}
    .li{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #f2f2f7}
    .li:last-child{border-bottom:none}
    .li-ico{font-size:20px;flex-shrink:0}
    .li-info{flex:1;min-width:0}
    .li-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .li-sub{font-size:11px;color:#8e8e93;margin-top:1px}
    .li-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
    .li-amt{font-size:14px;font-weight:600}
    .dbtn{background:none;border:none;font-size:14px;color:#c7c7cc;cursor:pointer}
    .pbtn{padding:5px 10px;border:1.5px solid #34c759;border-radius:8px;background:none;font-size:11px;font-weight:600;color:#34c759;cursor:pointer;white-space:nowrap}

    .badge{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
    .br{background:#fff2f1;color:#ff3b30}
    .ba{background:#fff8ee;color:#ff9500}
    .bg{background:#f0fff4;color:#34c759}
    .alrt{margin:12px 14px 0;background:#fff2f1;border-radius:14px;padding:11px 14px;border:1px solid #ffccc9}

    .pw{height:8px;background:#f2f2f7;border-radius:4px;overflow:hidden;margin:7px 0 3px}
    .pf{height:100%;border-radius:4px;transition:width .4s}
    .cr{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
    .cbw{flex:1;height:6px;background:#f2f2f7;border-radius:3px;overflow:hidden}
    .cb{height:100%;border-radius:3px}
    .brow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .bi{width:100px;padding:5px 9px;border:1px solid #e5e5ea;border-radius:9px;font-size:14px;text-align:right;background:#f9f9f9;color:#1c1c1e}
    .slbl{font-size:11px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:.4px;padding:8px 14px 4px}
    .empty{text-align:center;padding:24px 16px;font-size:13px;color:#c7c7cc}
    .cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
    .cal-dow{text-align:center;font-size:10px;color:#8e8e93;padding:4px 0;font-weight:600}

    .cal-d.hp::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#34c759}

    .cal-d.sel:not(.tod){background:#e8f0fe;color:#007aff}

    .dd-t{font-size:13px;font-weight:600;margin-bottom:8px}
    .ai-btn{width:100%;padding:13px;border:1.5px dashed #007aff;border-radius:12px;background:#f0f7ff;color:#007aff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}
    .cfg-av{width:64px;height:64px;border-radius:16px;background:#f2f2f7;border:2px dashed #007aff;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}

    #uscreen h2{font-size:22px;font-weight:700}
    #uscreen p{font-size:14px;color:#8e8e93}
    .ubtns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:4px}
    .ubtn{padding:14px 16px;border:1.5px solid #e5e5ea;border-radius:16px;background:#f9f9f9;font-size:16px;font-weight:600;cursor:pointer;color:#1c1c1e;display:flex;align-items:center;gap:10px}

    .uav img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .orl{font-size:12px;color:#c7c7cc}
    .cnw{display:flex;gap:8px;width:100%}

    .cnw button{padding:13px 16px;border:none;border-radius:12px;background:#007aff;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    .mo{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200}
    .mb{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px 40px;width:100%;max-width:480px}
    .mt{font-size:17px;font-weight:700;margin-bottom:4px}
    .ms{font-size:13px;color:#8e8e93;margin-bottom:16px}
    .mcl{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:#8e8e93;margin-top:-4px}
    .po{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .popt{padding:16px;border:1.5px solid #e5e5ea;border-radius:16px;background:#f9f9f9;font-size:14px;font-weight:600;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
    .popt span{font-size:26px}
    .loading{text-align:center;padding:40px;color:#8e8e93;font-size:14px}
    .fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:18px;width:54px;height:54px;border-radius:50%;background:#007aff;border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(0,122,255,.45);z-index:150;display:flex;align-items:center;justify-content:center;transition:transform .2s}

    .fab-overlay{position:fixed;inset:0;z-index:140;display:none}
    .fab-menu{position:fixed;bottom:calc(136px + env(safe-area-inset-bottom));right:18px;display:flex;flex-direction:column;gap:10px;z-index:150;display:none}
    .fab-item{display:flex;align-items:center;gap:10px;background:#fff;border:none;border-radius:22px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15);white-space:nowrap;color:#1c1c1e}

    .pw-who{display:flex;gap:8px;margin-top:8px}

    @media(prefers-color-scheme:dark){
      .fab-item{background:#2c2c2e;color:#f2f2f7}

    @media(prefers-color-scheme:dark){

      .li{border-color:#3a3a3c}
      .pw,.cbw{background:#3a3a3c}
      .alrt{background:#2d1210;border-color:#6d2320}
      .mnav button{background:#2c2c2e;color:#f2f2f7}
      .bi{background:#2c2c2e;border-color:#38383a;color:#f2f2f7}
      .dd{background:#2c2c2e}

      .mb{background:#2c2c2e}

      .wb{border-color:#38383a;color:#8e8e93}
      .wb.on{border-color:#0a84ff;color:#4da3ff;background:#0a1929}
      .ubtn{background:#2c2c2e;border-color:#38383a;color:#f2f2f7}
      .popt{background:#2c2c2e;border-color:#38383a;color:#f2f2f7}

      .cfg-av{border-color:#0a84ff;background:#2c2c2e}
    }
  </style>
</head>

<script>

// \u2500\u2500 Firebase sync \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function startSync(){
  ref.on('value', snap => {
    const d = snap.val();
    if(d){
      appData = {
        gastos: d.gastos ? Object.values(d.gastos) : [],
        contas: d.contas ? Object.values(d.contas) : [],
        budget: d.budget || 25000,
        lastBy: d.lastBy || '',
        lastAt: d.lastAt || ''
      };
    } else {
      appData = {gastos:[],contas:[],budget:25000,lastBy:'',lastAt:''};
    }
    synced = true;
    const sd = document.getElementById('syncDot');
    if(sd) sd.className = 'sync-dot';
    checkRecurring();
    render();
  }, err => {
    document.getElementById('syncDot').className = 'sync-dot off';
    document.getElementById('hdrSubTxt').textContent = 'Sem conex\u00E3o';
  });
}

function saveToFirebase(){
  const gastosObj = {};
  appData.gastos.forEach(g => { gastosObj[g.id] = g; });
  const contasObj = {};
  appData.contas.forEach(c => { contasObj[c.id] = c; });
  ref.set({
    gastos: gastosObj,
    contas: contasObj,
    budget: appData.budget,
    lastBy: cu,
    lastAt: new Date().toISOString()
  });
}

// \u2500\u2500 Helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function fmt(n){return'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){return new Date().toISOString().split('T')[0]}
function ddiff(ds){if(!ds)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(ds+'T00:00:00')-t)/86400000)}
function dbadge(ds){const d=ddiff(ds);if(d===null)return'';if(d<0)return`<span class="badge br">Vencida ${Math.abs(d)}d</span>`;if(d===0)return`<span class="badge ba">Hoje!</span>`;if(d<=5)return`<span class="badge ba">Em ${d}d</span>`;return`<span class="badge bg">Em ${d}d</span>`}
function ico(c){return(c||'\uD83D\uDCE6').split(' ')[0]}
function nm(c){return(c||'Outros').replace(/^\S+\s/,'')}
function f2b(f){return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}

function render(){
  document.getElementById('mLbl').textContent=MONTHS[curM]+' '+curY;
  const la=appData.lastAt?new Date(appData.lastAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
  document.getElementById('hdrSubTxt').textContent=appData.lastBy&&la?`${cu} \u00B7 ${appData.lastBy} \u00E0s ${la}`:`Ol\u00E1, ${cu}!`;
  const c=document.getElementById('content');
  if(tab==='dash')  c.innerHTML=rDash();
  if(tab==='cal')   c.innerHTML=rCal();
  if(tab==='gastos')c.innerHTML=rGastos();
  if(tab==='contas')c.innerHTML=rContas();
  if(tab==='cfg')   c.innerHTML=rCfg();
}

// \u2500\u2500 Dashboard \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function rDash(){
  const mg=appData.gastos.filter(g=>{const dt=new Date(g.date+'T00:00:00');return dt.getMonth()===curM&&dt.getFullYear()===curY});
  const tot=mg.reduce((s,g)=>s+g.amt,0);
  const pend=appData.contas.filter(c=>!c.paid), ptot=pend.reduce((s,c)=>s+c.amt,0);
  const bud=appData.budget||25000;
  const pct=bud>0?Math.min(100,tot/bud*100):0;
  const pc=pct>90?'#ff3b30':pct>70?'#ff9500':'#34c759';
  const urg=pend.filter(c=>{const df=ddiff(c.due);return df!==null&&df<=5}).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  const cm={};mg.forEach(g=>{cm[g.cat]=(cm[g.cat]||0)+g.amt});
  const cats=Object.entries(cm).sort((a,b)=>b[1]-a[1]),mx=cats[0]?.[1]||1;
  return`
  <div class="mcs">
    <div class="mc"><div class="lb">Gasto no m\u00EAs</div><div class="vl red">${fmt(tot)}</div></div>
    <div class="mc"><div class="lb">Contas pendentes</div><div class="vl amber">${fmt(ptot)}</div></div>
    <div class="mc full">
      <div class="brow"><span class="lb" style="margin:0">Or\u00E7amento mensal</span><input class="bi" type="number" value="${bud}" onchange="updBudget(this.value)"/></div>
      <div class="pw"><div class="pf" style="width:${pct.toFixed(1)}%;background:${pc}"></div></div>
      <div style="font-size:11px;color:#8e8e93;text-align:right">${fmt(tot)} de ${fmt(bud)} \u00B7 ${pct.toFixed(0)}% usado</div>
    </div>
  </div>
  ${urg.length?`<div class="alrt"><div class="alrt-t">\u26A0\uFE0F Contas vencendo em breve</div>${urg.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:13px"><span>${c.name}</span><div style="display:flex;align-items:center;gap:7px">${dbadge(c.due)}<strong class="red">${fmt(c.amt)}</strong></div></div>`).join('')}</div>`:''}
  <div class="sec">
    <div class="card"><div class="chd">Gastos por pessoa</div><div class="cbd">
      ${(()=>{const pw={};mg.forEach(g=>{pw[g.who]=(pw[g.who]||0)+g.amt});return Object.entries(pw).length?`<div class="pw-who">${Object.entries(pw).map(([w,v])=>`<div class="pw-tag" style="background:${w==='Aed\u00E3o'?'#e8f4fd':w==='Leti'?'#fde8f4':'#edf8ee'};color:${w==='Aed\u00E3o'?'#0055aa':w==='Leti'?'#aa0055':'#1a7a3a'}"><div style="font-size:13px">${w==='Aed\u00E3o'?'\uD83D\uDC68':w==='Leti'?'\uD83D\uDC69':'\uD83D\uDC6B'}</div><div>${w}</div><div style="font-size:13px;font-weight:700;margin-top:2px">${fmt(v)}</div></div>`).join('')}</div>`:'<div class="empty">Nenhum gasto</div>'})()}
    </div></div>
    <div class="card"><div class="chd">Por categoria</div><div class="cbd">
      ${cats.length?cats.map(([cat,val])=>`<div class="cr"><span style="font-size:16px">${ico(cat)}</span><span style="flex:1;font-size:12px">${nm(cat)}</span><div class="cbw"><div class="cb" style="width:${(val/mx*100).toFixed(1)}%;background:${CATS[cat]||'#888'}"></div></div><span style="font-size:11px;color:#8e8e93;min-width:76px;text-align:right">${fmt(val)}</span></div>`).join(''):'<div class="empty">Nenhum gasto</div>'}
    </div></div>
    <div class="card"><div class="chd">\u00DAltimos lan\u00E7amentos</div><div class="il">
      ${mg.slice(0,6).map(g=>`<div class="li"><span class="li-ico">${ico(g.cat)}</span><div class="li-info"><div class="li-name">${g.name}</div><div class="li-sub">${nm(g.cat)} \u00B7 ${g.date} \u00B7 ${g.who}</div></div><div class="li-r"><span class="li-amt red">${fmt(g.amt)}</span><button class="ebtn" onclick="editGasto(${g.id})">\u270F\uFE0F</button></div></div>`).join('')||'<div class="empty">Nenhum lan\u00E7amento</div>'}
    </div></div>
  </div>`;
}

// \u2500\u2500 Calendar \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function rCal(){
  const tn=new Date(),isNow=tn.getMonth()===curM&&tn.getFullYear()===curY,tdD=isNow?tn.getDate():null;
  const fd=new Date(curY,curM,1).getDay(),dim=new Date(curY,curM+1,0).getDate();
  const bd={},gd2={};
  appData.contas.forEach(c=>{if(!c.due)return;const dt=new Date(c.due+'T00:00:00');if(dt.getMonth()===curM&&dt.getFullYear()===curY){const day=dt.getDate();if(!bd[day])bd[day]=[];bd[day].push(c)}});
  appData.gastos.forEach(g=>{const dt=new Date(g.date+'T00:00:00');if(dt.getMonth()===curM&&dt.getFullYear()===curY){const day=dt.getDate();if(!gd2[day])gd2[day]=[];gd2[day].push(g)}});
  let h=`<div class="sec"><div class="card"><div class="cbd" style="padding-top:14px"><div class="cal-g">`;
  h+=DS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<fd;i++)h+=`<div class="cal-d emp"></div>`;
  for(let day=1;day<=dim;day++){
    const hb=bd[day]?.length>0,hg=gd2[day]?.length>0,ap=hb&&bd[day].every(b=>b.paid);
    let cls='cal-d';
    if(day===tdD)cls+=' tod';
    if(day===selDay)cls+=' sel';
    if(hb&&ap)cls+=' hp';else if(hb||hg)cls+=' hb';
    h+=`<div class="${cls}" onclick="selDay2(${day})">${day}</div>`;
  }
  h+=`</div><div style="display:flex;gap:14px;margin-top:6px;font-size:11px;color:#8e8e93">
    <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff3b30;margin-right:3px;vertical-align:middle"></span>Pendente</span>
    <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#34c759;margin-right:3px;vertical-align:middle"></span>Paga</span>
  </div>`;
  if(selDay){
    const db=bd[selDay]||[],dg=gd2[selDay]||[];
    const ds=`${curY}-${String(curM+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`;
    h+=`<div class="dd"><div class="dd-t">\uD83D\uDCC6 Dia ${selDay} de ${MONTHS[curM]}</div>`;
    if(db.length){h+=`<div style="font-size:11px;font-weight:600;color:#8e8e93;margin-bottom:6px">CONTAS</div>`;db.forEach(c=>{h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f2f2f7"><span style="font-size:17px">${ico(c.cat)}</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500${c.paid?';text-decoration:line-through;color:#8e8e93':''}">${c.name}</div><div style="font-size:11px;color:#8e8e93">${c.rec==='monthly'?'Mensal':c.rec==='yearly'?'Anual':'\u00DAnica'}</div></div><span style="font-size:13px;font-weight:600;color:${c.paid?'#8e8e93':'#ff3b30'}">${fmt(c.amt)}</span><button class="pbtn ${c.paid?'off':''}" onclick="pagConta(${c.id})">${c.paid?'\u21A9':'\u2713'}</button></div>`})}
    if(dg.length){h+=`<div style="font-size:11px;font-weight:600;color:#8e8e93;margin:10px 0 6px">GASTOS</div>`;dg.forEach(g=>{h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f2f2f7"><span style="font-size:17px">${ico(g.cat)}</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500">${g.name}</div><div style="font-size:11px;color:#8e8e93">${nm(g.cat)} \u00B7 ${g.who}</div></div><span style="font-size:13px;font-weight:600;color:#ff3b30">${fmt(g.amt)}</span><button class="dbtn" onclick="delGasto(${g.id})">\u2715</button></div>`})}
    if(!db.length&&!dg.length)h+=`<div style="text-align:center;padding:12px 0;font-size:13px;color:#8e8e93">Nenhum lan\u00E7amento</div>`;
    h+=`<div style="display:flex;gap:8px;margin-top:10px"><button onclick="qa('gastos','${ds}')" style="flex:1;padding:9px;border:none;border-radius:10px;background:#007aff;color:#fff;font-size:13px;font-weight:600;cursor:pointer">+ Gasto</button><button onclick="qa('contas','${ds}')" style="flex:1;padding:9px;border:none;border-radius:10px;background:#00c7be;color:#fff;font-size:13px;font-weight:600;cursor:pointer">+ Conta</button></div></div>`;
  }
  h+=`</div></div></div>`;return h;
}

// \u2500\u2500 Gastos \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

      </div>
      <button class="btn" onclick="addGasto()">+ Adicionar gasto</button>
    </div></div>
    <div class="card"><div class="chd">Lan\u00E7amentos \u2014 ${MONTHS[curM]}</div><div class="il">
      ${mg.length?mg.map(g=>`<div class="li"><span class="li-ico">${ico(g.cat)}</span><div class="li-info"><div class="li-name">${g.name}</div><div class="li-sub">${nm(g.cat)} \u00B7 ${g.date} \u00B7 ${g.who}</div></div><div class="li-r"><span class="li-amt red">${fmt(g.amt)}</span><button class="ebtn" onclick="editGasto(${g.id})">\u270F\uFE0F</button><button class="dbtn" onclick="delGasto(${g.id})">\u2715</button></div></div>`).join(''):'<div class="empty">Nenhum gasto neste m\u00EAs</div>'}
    </div></div>
  </div>`;

// \u2500\u2500 Contas \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function rContas(){
  const pend=appData.contas.filter(c=>!c.paid).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  const paid=appData.contas.filter(c=>c.paid);
  const id=prefDate||'';prefDate='';
  return`<div class="sec">
    <button class="ai-btn" onclick="document.getElementById('pBill').click()">\uD83D\uDCF7 Fotografar conta <span style="font-size:11px;background:#007aff;color:#fff;padding:2px 8px;border-radius:20px;font-weight:700">IA</span></button>

// \u2500\u2500 AI Bill scan \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
window.onBillPhoto=async function(input){
  if(!input.files||!input.files[0])return;
  const file=input.files[0];
  const ar=document.getElementById('aiR');
  if(ar)ar.innerHTML=`<div style="text-align:center;padding:14px;font-size:13px;color:#8e8e93">\uD83E\uDD16 Analisando com IA\u2026</div>`;
  try{
    const b64=await f2b(file);
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type,data:b64.split(',')[1]}},{type:'text',text:'Analise esta conta/boleto. Responda APENAS em JSON: {"nome":"nome","valor":123.45,"vencimento":"YYYY-MM-DD"} - valor sem R$ ou pontos, null se n\u00E3o encontrar'}]}]})});
    const data=await res.json();
    let info;try{info=JSON.parse((data.content?.[0]?.text||'{}').replace(/```json|```/g,'').trim())}catch{info={}}
    if(info.nome||info.valor){
      if(ar)ar.innerHTML=`<div class="card" style="margin-bottom:10px;border-color:#34c759"><div class="chd" style="color:#34c759">\u2705 IA identificou</div><div class="cbd">
        <div class="fg"><label>Nome</label><input id="aiN" value="${info.nome||''}"/></div>
        <div class="fr"><div class="fg"><label>Valor</label><input type="number" id="aiA" value="${info.valor||''}" inputmode="decimal"/></div>
        <div class="fg"><label>Vencimento</label><input type="date" id="aiD" value="${info.vencimento||''}"/></div></div>
        <button class="btn teal" onclick="saveAI()">\u2713 Salvar</button>
        <button onclick="document.getElementById('aiR').innerHTML=''" style="width:100%;margin-top:8px;padding:10px;border:none;border-radius:12px;background:none;color:#8e8e93;font-size:14px;cursor:pointer">Cancelar</button>
      </div></div>`;
    } else {
      if(ar){ar.innerHTML=`<div style="text-align:center;padding:10px;font-size:13px;color:#ff9500;margin-bottom:8px">\u26A0\uFE0F N\u00E3o consegui ler. Preencha manualmente.</div>`;setTimeout(()=>{if(ar)ar.innerHTML=''},3000)}
    }
  }catch(e){if(ar){ar.innerHTML=`<div style="text-align:center;padding:10px;font-size:13px;color:#ff3b30">\u274C Erro. Tente novamente.</div>`;setTimeout(()=>{if(ar)ar.innerHTML=''},3000)}}
  input.value='';
}
window.saveAI=function(){
  const n=document.getElementById('aiN')?.value.trim(),a=parseFloat(document.getElementById('aiA')?.value),du=document.getElementById('aiD')?.value;
  if(!n||isNaN(a)||a<=0){alert('Confira nome e valor.');return}
  appData.contas.unshift({id:Date.now(),name:n,amt:a,due:du,rec:'monthly',cat:'\uD83D\uDCA1 Consumo (luz/\u00E1gua/net)',paid:false,paidBy:''});
  saveToFirebase();
  const ar=document.getElementById('aiR');if(ar)ar.innerHTML='';
}

  const c=appData.contas.find(x=>x.id===id);if(!c)return;
  const n=document.getElementById('ecN').value.trim(),a=parseFloat(document.getElementById('ecA').value);
  if(!n||isNaN(a)||a<=0){alert('Confira nome e valor.');return}
  c.name=n;c.amt=a;c.due=document.getElementById('ecD').value||c.due;
  c.cat=document.getElementById('ecC').value;c.rec=document.getElementById('ecR').value;
  saveToFirebase();closeModal();
}

// \u2500\u2500 Recorr\u00EAncia autom\u00E1tica \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function checkRecurring(){
  const now=new Date(),tm=now.getMonth(),ty=now.getFullYear();
  let changed=false;
  appData.contas.filter(c=>c.rec==='monthly'&&c.paid&&c.due).forEach(c=>{
    const d=new Date(c.due+'T00:00:00'),dm=d.getMonth(),dy=d.getFullYear();
    if(dy<ty||(dy===ty&&dm<tm)){
      const exists=appData.contas.some(x=>x.name===c.name&&!x.paid&&x.due&&
        new Date(x.due+'T00:00:00').getMonth()===tm&&new Date(x.due+'T00:00:00').getFullYear()===ty);
      if(!exists){
        const nd=new Date(d);nd.setMonth(tm);nd.setFullYear(ty);
        appData.contas.push({id:Date.now()+Math.random(),name:c.name,amt:c.amt,
          due:nd.toISOString().split('T')[0],rec:'monthly',cat:c.cat,paid:false,paidBy:''});
        changed=true;
      }
    }
  });
  appData.contas.filter(c=>c.rec==='yearly'&&c.paid&&c.due).forEach(c=>{
    const d=new Date(c.due+'T00:00:00');
    if(d.getFullYear()<ty){
      const exists=appData.contas.some(x=>x.name===c.name&&!x.paid&&x.due&&
        new Date(x.due+'T00:00:00').getFullYear()===ty);
      if(!exists){
        const nd=new Date(d);nd.setFullYear(ty);
        appData.contas.push({id:Date.now()+Math.random(),name:c.name,amt:c.amt,
          due:nd.toISOString().split('T')[0],rec:'yearly',cat:c.cat,paid:false,paidBy:''});
        changed=true;
      }
    }
  });
  if(changed)saveToFirebase();
}
